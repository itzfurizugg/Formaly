name: formaly
description: Form Maker Mobile App

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.1
  animate_do: ^4.2.0
  page_transition: ^2.2.1

  # Menyimpan session ujian sementara
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.17.2

  # Keamanan saat mengerjakan ujian
  screen_protector: ^1.5.3
  wakelock_plus: ^1.7.0

  # Renderer HTML/WYSIWYG untuk soal dan jawaban dari creator
  flutter_widget_from_html_core: ^0.17.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
